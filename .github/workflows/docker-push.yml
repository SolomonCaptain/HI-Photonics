name: Build and Push to ACR

on:
  #push:
  #  branches: [ main, master ]
  #pull_request:
  #  branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

env:
  # 请根据你的实际 ACR 信息修改以下三个值（建议使用 GitHub Secrets）
  REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  USERNAME: ${{ secrets.ALIYUN_USERNAME }}
  PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.PASSWORD }}

      # 构建并推送后端镜像
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .                     # 使用项目根目录作为构建上下文
          file: Dockerfile.backend       # 指定后端 Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ vars.NAMESPACE }}/backend:latest
            ${{ env.REGISTRY }}/${{ vars.NAMESPACE }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建并推送前端镜像
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .                     # 使用项目根目录作为构建上下文
          file: Dockerfile.frontend      # 指定前端 Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api       # 传递前端构建参数
          tags: |
            ${{ env.REGISTRY }}/${{ vars.NAMESPACE }}/frontend:latest
            ${{ env.REGISTRY }}/${{ vars.NAMESPACE }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max