# HI-Photonics Docker Compose 配置
# 一键部署光子学逆向设计平台

services:
  # ============================================
  # 后端 API 服务
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hi-photonics-backend
    restart: unless-stopped
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-4096}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-hi_photonics_knowledge}
    volumes:
      # 数据持久化
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs
      - ./models/pretrained:/app/models/pretrained:ro
    networks:
      - hi-photonics-network
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ============================================
  # 前端 Web 服务
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api
    container_name: hi-photonics-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - hi-photonics-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Qdrant 向量数据库
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hi-photonics-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - hi-photonics-network
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

# ============================================
# 网络配置
# ============================================
networks:
  hi-photonics-network:
    driver: bridge
    name: hi-photonics-network

# ============================================
# 数据卷
# ============================================
volumes:
  qdrant-storage:
    name: hi-photonics-qdrant-storage
