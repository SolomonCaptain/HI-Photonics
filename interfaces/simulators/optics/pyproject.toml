[build-system]
requires = ["scikit-build-core>=0.12.2", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "optics"
version = "0.1.0"
description = "High-performance FDTD optics simulator for photonics design"
authors = [
    {name = "HI-Photonics Team"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
]

[tool.scikit-build]
cmake.args = ["-DCMAKE_BUILD_TYPE=Release"]
wheel.packages = ["src/optics"]

[tool.pytest.ini_options]
testpaths = ["tests"]